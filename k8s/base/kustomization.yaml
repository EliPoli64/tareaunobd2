apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - secret.yaml
  - db-pvc.yaml
  - db-deployment.yaml
  - db-service.yaml
  - keycloak-deployment.yaml
  - keycloak-service.yaml
  - app-deployment.yaml
  - app-service.yaml

 # para el inicio automatico
configMapGenerator:
  - name: db-init-scripts
    files:
      - migrations/01_Tabla.sql
      - migrations/02_SP_Reservas.sql