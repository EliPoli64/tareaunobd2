apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: tareaunobd2-keycloak:latest
          imagePullPolicy: Never
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 6767
          env:
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL_HOST
              value: "db"
            - name: KC_DB_URL_PORT
              value: "5432"
            - name: KC_HTTP_PORT
              value: "6767"
            - name: KC_HEALTH_ENABLED
              value: "true"
            # --- NUEVAS LÍNEAS AQUÍ ABAJO ---
            - name: KC_DB_URL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_DB
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets