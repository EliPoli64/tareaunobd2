services:
  db:
    env_file: [.env]
    build: ./db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
  keycloak: 
    build: ./id-provider
    command: start-dev
    env_file: [.env]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_PORT: ${POSTGRES_PORT:-5432}
      KC_DB_URL_DATABASE: ${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_PORT: 6767
    ports: 
      - "6767:6767"
    depends_on:
      - db
  api:
    build: ./api
    env_file: [.env]
    environment:
      DB_HOST: db
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      PORT: ${API_PORT:-1412}
    ports:
      - "1412:1412"
    depends_on:
      - db  
  migrator:
    image: postgres:18.6-alpine3.24
    env_file: [.env]
    volumes: [./db/migrations:/migrations:ro]
    command: >
      sh -c "psql $$POSTGRES_URL -f /migrations/01_Tabla.sql -f /migrations/02_SP_Reservas.sql"
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
